<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kraftstoffpreis-Analyse</title>
  <link href="style.css" rel="stylesheet" />
  <script defer src="script.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <div class="max-w-xl mx-auto p-4 mt-10 bg-white rounded-xl shadow-md">
    <h1 class="text-2xl font-bold mb-4">⛽ Günstigste Tankstelle jetzt</h1>
    <select id="fuelType" class="p-2 border rounded mb-4">
      <option value="diesel">Diesel</option>
      <option value="e5">Super (E5)</option>
      <option value="e10">Super E10</option>
    </select>
    <button id="loadBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Aktualisieren</button>

    <div id="result" class="mt-6 text-lg">
      <p><strong>Name:</strong> <span id="stationName">–</span></p>
      <p><strong>Preis:</strong> <span id="stationPrice">–</span> €/L</p>
      <p><strong>Adresse:</strong> <span id="stationAddress">–</span></p>
    </div>
  </div>
</body>
</html>
